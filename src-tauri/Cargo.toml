[package]
name = "ai-video-editor"
version = "0.1.0"
description = "AI Video Editor — Windows desktop app for AI-assisted video editing"
authors = ["AI Video Editor contributors"]
edition = "2021"
# Bumped from "1.77.2" (Phase 12 crash handling, master prompt §54/§86):
# `crate::logging`'s panic hook uses `std::panic::PanicHookInfo`, stable
# since 1.81.0 (a rename of the now-deprecated `std::panic::PanicInfo`,
# which `cargo clippy -D warnings` would otherwise flag as deprecated on
# this project's real 1.98.1 build toolchain). Same "a new dependency/API
# needs a newer MSRV than the declared floor" precedent
# `tauri-plugin-updater` already set when it bumped this from "1.77" to
# "1.77.2" above it.
rust-version = "1.81"
default-run = "ai-video-editor"

[lib]
name = "ai_video_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# specta 2.x is still pre-1.0-stable-tagged on crates.io (rc only, confirmed
# by resolving against the crates.io index); pin exact rc versions rather
# than "2" so `cargo add`/`cargo update` don't silently jump between
# incompatible rc builds. `serde_json` feature enables `Type` for
# `serde_json::Value`, used by the intentionally-opaque `Effect::params`/
# `AiState` fields in `project::types`.
specta = { version = "2.0.0-rc.22", features = ["derive", "serde_json"] }
specta-typescript = "0.0.9"
tauri-specta = { version = "2.0.0-rc.21", features = ["derive", "typescript"] }
# `bundled`: statically links SQLite instead of requiring a system
# libsqlite3, so Windows packaging (Phase 12) never needs to ship or detect
# a separate SQLite DLL for the media library index (master prompt §35).
rusqlite = { version = "0.31", features = ["bundled"] }
# Silero-VAD-via-ONNX voice activity detector. Same crate/version autocut
# depends on (`vendor/autocut/src-tauri/Cargo.toml`) — independently
# licensed and reusable regardless of autocut's own code-license status
# (docs/architecture-audit.md §3). Backs `vad::silero::SileroVadProvider`.
voice_activity_detector = "0.2"
# Rust bindings around whisper.cpp (master prompt §14 Transcription) — the
# standard, actively-maintained wrapper the master prompt itself suggests
# evaluating. Its build script (`whisper-rs-sys`) vendors and compiles
# whisper.cpp's C++ source at *this crate's* build time (needs cmake + a
# C/C++ toolchain; no system-installed whisper.cpp required), the same
# "compile the real thing at build time" approach `rusqlite`'s `bundled`
# feature already uses above for SQLite. Default features = CPU-only; see
# `[features] cuda` below and `transcription::whisper` module doc comment
# for the GPU/CUDA story (architecturally wired, not compiled/verified in
# this environment).
whisper-rs = "0.16"
# Blocking HTTP client for resumable model downloads
# (`transcription::download`, master prompt §60) and, since Phase 10, every
# `ai::*` provider adapter's JSON request/response bodies
# (`Request::send_json`/`Response::into_json`, gated behind the `json`
# feature below). Default features pull in `rustls` (pure-Rust TLS, no
# system/vendored OpenSSL to manage for Windows packaging) + gzip. Chosen
# over `reqwest` because this crate has no async runtime dependency
# elsewhere for HTTP — downloads/provider calls run on a background thread
# (`tauri::async_runtime::spawn_blocking`), the same synchronous shape as
# every other long-running job in this crate (`media::proxy`/`render::job`),
# so a blocking client is the simpler fit.
ureq = { version = "2.12", features = ["json"] }
# SHA-256 for real, cryptographic downloaded-model verification
# (`transcription::download`, master prompt §53 "Validate downloaded model
# hashes when possible") — Hugging Face's own CDN exposes each git-LFS-
# tracked model file's real SHA-256 via an `X-Linked-ETag` response header on
# the pre-redirect response (verified with a real `curl -IL` against
# `ggml-tiny.bin`, see that module's doc comment), so "when possible" is
# genuinely possible here, not just a byte-count completeness check. Pure-
# Rust, no OpenSSL/vendored-C dependency, matching this project's existing
# preference (`ureq`'s `rustls` choice above) for a simple Windows build.
sha2 = "0.10"
# Phase 12 auto-update architecture (master prompt §62): Tauri's own
# official updater plugin, the idiomatic mechanism for a Tauri 2 app rather
# than a custom-built HTTP polling system. Pinned to a real, current stable
# release (not "2", so `cargo update` can't silently jump onto a yet-newer
# manifest-schema revision) — required bumping `rust-version` above from
# "1.77" to "1.77.2" since 2.11.0 itself declares that MSRV. Wired in
# `lib.rs` alongside `tauri-plugin-process` (below), which supplies the
# real "restart to apply" action after an update installs — see
# `commands::update` module doc comment for the full design, including the
# still-placeholder `endpoints`/`pubkey` in `tauri.conf.json`.
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"
# Phase 12 crash handling/logging (master prompt §54/§55/§86): structured,
# leveled logging to a real rolling log file under
# `%LOCALAPPDATA%\AI Video Editor\logs\` (see `crate::logging`), plus the
# backbone for the panic hook that captures Rust panics with a real
# backtrace instead of a stderr console window that doesn't exist in a
# release GUI build. `tracing` + `tracing-subscriber` (fmt + env-filter, so
# `RUST_LOG`/a future Settings "debug logging" toggle can raise verbosity
# per master prompt §55's "allow debug logging from settings") +
# `tracing-appender` (daily-rolling non-blocking file writer) is the
# idiomatic combination for a Tauri/Rust app, not a bespoke logger.
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
# System Information panel (master prompt §78): real OS version/CPU/RAM/disk
# facts `crate::logging`/`commands::diagnostics` has no other source for
# (GPU/FFmpeg/CapCut/models are all reused from their own Phase 6/3/9/7
# detectors instead of duplicated here). `disk` feature only for the
# models/templates/project-adjacent free-space checks; `network`/`component`/
# `user` left off since nothing here needs them.
sysinfo = { version = "0.36.1", default-features = false, features = ["system", "disk"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Enables whisper-rs's `cuda` feature, which links against a real CUDA
# toolkit (nvcc etc.) at *compile* time. NOT enabled or verified by any
# build in this repo's current environment (no CUDA SDK in the WSL2 build
# container, and not confirmed present on the target Windows machine either
# — see `transcription::whisper` module doc comment and
# `IMPLEMENTATION_PLAN.md` Phase 7). A future build on a machine with the
# CUDA toolkit installed can opt in with `cargo build --features cuda` and
# should re-verify real GPU transcription before calling GPU support done.
cuda = ["whisper-rs/cuda"]

# Windows-only: `crate::capcut::detect`'s optional/best-effort uninstall
# registry scan (`IMPLEMENTATION_PLAN.md` Phase 9 "plus optional registry
# lookups"). Scoped to `cfg(windows)` so it's never resolved/compiled on the
# Linux WSL2 environment this crate is actually built and tested in (see
# `HANDOFF.md` "Build/test environment") — the registry module itself is
# also `#[cfg(target_os = "windows")]`-gated, this just keeps the dependency
# graph itself Windows-only to match.
[target.'cfg(windows)'.dependencies]
winreg = "0.52"
# Windows-only: `crate::ai::credentials::WindowsCredentialStore` (Phase 10,
# master prompt §17 "Store credentials securely using Windows Credential
# Manager"). `keyring`'s default Windows backend wraps the real Win32
# Credential Manager API (CredWriteW/CredReadW/CredDeleteW) — same
# cfg(windows)-only-dependency pattern as `winreg` above, and for the same
# reason: never resolved/compiled on this crate's actual Linux dev/test host.
keyring = "2"
